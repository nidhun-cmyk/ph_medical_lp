function toggleMember(rel){if(membersOf(rel).length){state.members=state.members.filter(m=>m.relation!==rel)}else{add(rel);return}render()}function membersOf(rel){return state.members.filter(m=>m.relation===rel)}function memberName(m){return m.relation+(multi.has(m.relation)?' '+(membersOf(m.relation).findIndex(x=>x.id===m.id)+1):'')}function add(rel){if(!multi.has(rel)&&membersOf(rel).length)return;state.members.push({id:idSequence++,relation:rel,age:null,conditions:[],otherCondition:''});render()}function remove(rel){let list=membersOf(rel);if(!list.length)return;state.members=state.members.filter(m=>m.id!==list[list.length-1].id);render()}
function chatLine(s,mine=false){return `<div class="bubble-row ${mine?'me':''}">${mine?'':'<div class="avatar">ph</div>'}<div class="bubble">${esc(s)}</div></div>`}
function choice(label,selected,action,value){return `<button type="button" class="choice" aria-pressed="${selected}" data-action="${action}" data-value="${esc(value??label)}"><span class="check">${selected?'✓':''}</span><span>${esc(label)}</span></button>`}
// Relationship-aware age limits. A 16-year minimum generational gap is a
// practical form-level guardrail, not a statement of UAE law or insurer eligibility.
const FAMILY_AGE_GAP=16;
const POLICYHOUSE_BUILD='2026-10-12-age-criteria-v2';
function ageRange(m){
  let min=(m.relation==='Self'||(m.relation==='Spouse'&&!state.spouseException))?18:0,max=100;
  const self=membersOf('Self')[0];
  const parents=state.members.filter(x=>x.relation==='Mother'||x.relation==='Father');
  const children=state.members.filter(x=>x.relation==='Son'||x.relation==='Daughter');
  if(m.relation==='Self'){
    for(const parent of parents)if(parent.age!==null)max=Math.min(max,parent.age-FAMILY_AGE_GAP);
    for(const child of children)if(child.age!==null)min=Math.max(min,child.age+FAMILY_AGE_GAP);
  }else if(self&&self.age!==null){
    if(m.relation==='Father'||m.relation==='Mother')min=Math.max(min,self.age+FAMILY_AGE_GAP);
    if(m.relation==='Son'||m.relation==='Daughter')max=Math.min(max,self.age-FAMILY_AGE_GAP);
  }
  return {min,max};
}
function ageOptions(m){const {min,max}=ageRange(m);
  const options=max>=min?Array.from({length:max-min+1},(_,i)=>i+min):[];
  return `<option value="">Select age</option>${options.map(i=>`<option value="${i}" ${m.age===i?'selected':''}>${i} ${i===1?'year':'years'}</option>`).join('')}`;
}
function reconcileAges(changedId){
  // The most recently changed age takes priority. Revalidate everyone else.
  const changed=state.members.find(m=>m.id===changedId);
  if(!changed||changed.age===null)return;
  if(changed.relation==='Self'){
    state.members.forEach(m=>{
      if(m.id===changed.id||m.age===null)return;
      if((m.relation==='Father'||m.relation==='Mother')&&m.age<changed.age+FAMILY_AGE_GAP)m.age=null;
      if((m.relation==='Son'||m.relation==='Daughter')&&m.age>changed.age-FAMILY_AGE_GAP)m.age=null;
    });
  }else if(changed.relation==='Father'||changed.relation==='Mother'||changed.relation==='Son'||changed.relation==='Daughter'){
    const self=membersOf('Self')[0];
    if(self&&self.age!==null){
      const tooYoungParent=(changed.relation==='Father'||changed.relation==='Mother')&&changed.age<self.age+FAMILY_AGE_GAP;
      const tooOldChild=(changed.relation==='Son'||changed.relation==='Daughter')&&changed.age>self.age-FAMILY_AGE_GAP;
      if(tooYoungParent||tooOldChild)self.age=null;
    }
  }
  state.members.forEach(m=>{
    if(m.id===changedId||m.age===null)return;
    const range=ageRange(m);
    if(m.age<range.min||m.age>range.max)m.age=null;
  });
}
function ageRuleHint(m){
 const {min,max}=ageRange(m);
 if(min>max)return 'No ages available with the ages already selected. Change a related family member’s age first.';
 if(m.relation==='Mother'||m.relation==='Father')return 'At least '+min+' years'+(membersOf('Self').length&&membersOf('Self')[0].age!==null?' (based on Self’s age)':'')+'.';
 if((m.relation==='Son'||m.relation==='Daughter')&&membersOf('Self').length&&membersOf('Self')[0].age!==null)return 'Up to '+max+' years (based on Self’s age).';
 if(m.relation==='Self'&&(min>18||max<100))return 'Allowed range: '+min+'–'+max+' years (based on selected family ages).';
 return '';
}
function localMobile(s){const d=String(s||'').replace(/\D/g,'');return /^5[024568]\d{7}$/.test(d)?d:null}
function validateEmail(s){return !s||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)}
function render(){if(step===6)return; $('stepLabel').textContent=`Step ${step+1} of 6`;$('barFill').style.width=(100*(step+1)/6)+'%';$('back').style.visibility=step===0?'hidden':'visible';$('next').textContent=step===5?'Request My Quote ›':'Continue ›';$('error').textContent='';let chat='',body='';
if(step===0){chat=chatLine('Hi there! Tell us who needs health insurance, and our PolicyHouse advisor will help you with suitable options over a call.');body=`<h2>Who would you like to cover?</h2><div class="choices member-choices">${relationships.map(r=>{let count=membersOf(r).length,selected=count>0,display=r==='Spouse'?'Wife':r;return `<div class="member-choice ${selected?'selected':''}"><button type="button" class="member-select" data-action="toggle" data-value="${r}" aria-pressed="${selected}"><span class="check">${selected?'✓':''}</span><span>${display}</span>${multi.has(r)&&count>1?`<span class="member-count">${count}</span>`:''}</button>${multi.has(r)&&selected?`<div class="child-adjust"><button type="button" data-action="remove" data-value="${r}" aria-label="Remove one ${r.toLowerCase()}" title="Remove one ${r.toLowerCase()}">−</button><span>${count}</span><button type="button" data-action="add" data-value="${r}" aria-label="Add another ${r.toLowerCase()}" title="Add another ${r.toLowerCase()}">+</button></div>`:''}</div>`}).join('')}</div><p class="note">Have more than one son or daughter? Select Son or Daughter, then tap + to add another child.</p>`}
if(step===1){chat=chatLine('Who needs cover?')+chatLine(state.members.map(memberName).join(', '),true)+chatLine(state.members.length===1?'Great. Please enter the age.':'Great. Please enter each member’s age.');body=`<h2>${state.members.length===1?'How old is '+(state.members[0].relation==='Self'?'the insured person?':esc(memberName(state.members[0]))+'?'):'How old is each family member?'}</h2><p class="sub">${state.members.length===1?'Select the age of the person to be insured.':'Each member has an individual age.'}</p>${state.members.map(m=>`<div class="age-item"><div><strong>${esc(memberName(m))}</strong>${m.relation==='Spouse'?'<div class="note" style="margin:2px 0 0">Standard minimum: 18 years</div>':''}${ageRuleHint(m)?`<div class="note" style="margin:4px 0 0">${esc(ageRuleHint(m))}</div>`:''}</div><select class="field" aria-label="Age for ${esc(memberName(m))}" data-age="${m.id}">${ageOptions(m)}</select></div>`).join('')}${membersOf('Spouse').length?`<label class="consent"><input type="checkbox" id="spouseException" ${state.spouseException?'checked':''}><span>My spouse is under 18 and I have a legally recognised exception. Request advisor assistance with this case.</span></label><p class="note">Age rules vary by legal context and insurer. Exceptions require advisor review; selecting this option does not guarantee eligibility.</p>`:''}`}
if(step===2){chat=chatLine(state.members.length===1?'Thanks, I’ve noted the age.':'Thanks, I’ve noted everyone’s age.')+chatLine('Which UAE emirate will the insurance be for?');body=`<h2>Which emirate do you need cover in?</h2><p class="sub">Choose the relevant UAE emirate.</p><div class="choices">${emirates.map(e=>choice(e,state.emirate===e,'emirate',e)).join('')}</div>`}
if(step===3){chat=chatLine('Location recorded.')+chatLine(state.emirate,true)+chatLine(state.members.length===1?'Now let’s check for any existing medical conditions.':'Now let’s record any existing medical conditions for each person separately.');body=`<h2>Medical history</h2><p class="sub">${state.members.length===1?'Select any existing medical conditions for the person to be insured.':'Select medical conditions separately for each family member.'} These details help our advisor prepare; declared conditions are not guaranteed to be covered.</p>${state.members.map(m=>`<div class="medical-item"><h3>${esc(memberName(m))} <span style="font-weight:400;color:#868696">· ${m.age??'—'} years</span></h3><p>${state.members.length===1?'Do you have any of these existing medical conditions?':'Does '+esc(memberName(m))+' have any of these medical conditions?'}</p><div class="choices">${illnesses.map(c=>choice(c,m.conditions.includes(c),'illness',m.id+'|'+c)).join('')}</div>${m.conditions.includes('Other condition')?`<div style="margin-top:11px"><label class="label" for="other-${m.id}">Please specify (optional)</label><input class="field" id="other-${m.id}" data-other="${m.id}" placeholder="Condition name" value="${esc(m.otherCondition)}" maxlength="100"></div>`:''}</div>`).join('')}<p class="note">Medical information is sensitive. Only share what is needed for this enquiry. You may choose “Prefer to discuss on call” for any member.</p>`}
if(step===4){chat=chatLine('Thank you. Just your contact details now.')+chatLine('Our advisor will call you about your health insurance enquiry.');body=`<h2>Share Your Contact Details</h2><p class="sub">Enter your details and a PolicyHouse advisor will call to discuss suitable health insurance options.</p><div class="two"><div><label class="label" for="name">Full name *</label><input class="field" id="name" autocomplete="name" maxlength="90" placeholder="Your full name" value="${esc(state.name)}"></div><div><label class="label" for="mobile">UAE mobile number *</label><div class="phone-wrap"><span class="phone-prefix">+971</span><input class="field" id="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="9" pattern="5[0-9]{8}" placeholder="5XXXXXXXX" aria-describedby="mobileFeedback" value="${esc(state.mobile)}"></div><div id="mobileFeedback" class="phone-valid" role="status" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.1 14.4-4-4 1.4-1.4 2.6 2.6 4.8-4.8 1.4 1.4-6.2 6.2Z"/></svg><span>Number format verified</span><span class="phone-valid-note">(not OTP verified)</span></div></div><div><label class="label" for="email">Email (optional)</label><input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(state.email)}"></div><div><label class="label" for="time">Preferred call time</label><select class="field" id="time">${['Anytime','Morning (9 AM–12 PM)','Afternoon (12–5 PM)','Evening (5–8 PM)'].map(t=>`<option ${state.time===t?'selected':''}>${t}</option>`).join('')}</select></div></div><label class="consent"><input type="checkbox" id="consent" ${state.consent?'checked':''}><span>I consent to PolicyHouse using the details I provided, including family members’ health information, to process my enquiry and contact me by phone about health insurance. I confirm I have authority to provide these details. *</span></label><p class="note">Prototype: link your live privacy notice here before publishing. Collect and store health information securely and limit staff access.</p>`}
if(step===5){chat=chatLine('Almost done! Please review your details before requesting a call.');body=`<h2>Review Your Enquiry</h2><p class="sub">Please make sure everything is correct.</p><div class="review"><h3>Family members (${state.members.length})</h3>${state.members.map(m=>`<p><strong>${esc(memberName(m))}, ${m.age} yrs</strong><br>${esc(m.conditions.join(', ')||'Not provided')}${m.otherCondition&&m.conditions.includes('Other condition')?' — '+esc(m.otherCondition):''}</p>`).join('')}</div><div class="review"><h3>Location and contact</h3><p><strong>Emirate:</strong> ${esc(state.emirate)}</p><p><strong>Name:</strong> ${esc(state.name)}</p><p><strong>Mobile:</strong> +971 ${esc(state.mobile)}</p><p><strong>Email:</strong> ${esc(state.email||'Not provided')}</p><p><strong>Preferred call time:</strong> ${esc(state.time)}</p></div><p class="note">Submitting this form does not purchase insurance, provide a confirmed quotation or guarantee coverage.</p>`}
$('chat').innerHTML=chat;$('panel').innerHTML=body;wire();}
function wire(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{let a=el.dataset.action,v=el.dataset.value;if(a==='add')add(v);if(a==='remove')remove(v);if(a==='toggle')toggleMember(v);if(a==='emirate'){state.emirate=v;render()}if(a==='illness'){let [id,c]=v.split('|'),m=state.members.find(x=>x.id===Number(id));if(!m)return;if(c==='None of these'||c==='Prefer to discuss on call'){m.conditions=m.conditions.includes(c)?[]:[c]}else{m.conditions=m.conditions.filter(x=>x!=='None of these'&&x!=='Prefer to discuss on call');m.conditions=m.conditions.includes(c)?m.conditions.filter(x=>x!==c):[...m.conditions,c]}render()}}));document.querySelectorAll('[data-age]').forEach(el=>el.addEventListener('change',()=>{let m=state.members.find(x=>x.id===+el.dataset.age);m.age=el.value===''?null:+el.value;reconcileAges(m.id);render()}));document.querySelectorAll('[data-other]').forEach(el=>el.addEventListener('input',()=>{state.members.find(x=>x.id===+el.dataset.other).otherCondition=el.value}));if($('spouseException'))$('spouseException').onchange=e=>{state.spouseException=e.target.checked;if(!state.spouseException)state.members.filter(m=>m.relation==='Spouse'&&m.age!==null&&m.age<18).forEach(m=>m.age=null);render()};['name','mobile','email','time','consent'].forEach(k=>{if($(k))$(k).addEventListener(k==='consent'||k==='time'?'change':'input',e=>{if(k==='mobile'){const value=e.target.value.replace(/\D/g,'').replace(/^971/,'').replace(/^0(?=5)/,'').slice(0,9);e.target.value=value;state.mobile=value;updateMobileBadge()}else state[k]=k==='consent'?e.target.checked:e.target.value})});updateMobileBadge()}
function updateMobileBadge(){let node=$('mobileFeedback');if(node)node.classList.toggle('visible',!!localMobile(state.mobile))}
function fail(s){$('error').textContent=s;return false}function valid(){if(step===0&&!state.members.length)return fail('Add at least one family member.');if(step===1){let m=state.members.find(m=>{const r=ageRange(m);return m.age===null||m.age<r.min||m.age>r.max});if(m)return fail('Please select an eligible age for '+memberName(m)+'. Check the age guidance shown below each member.')}if(step===2&&!state.emirate)return fail('Please select an emirate.');if(step===3){let m=state.members.find(m=>!m.conditions.length);if(m)return fail('Please select a medical history option for '+memberName(m)+'.')}if(step===4){if(state.name.trim().length<2)return fail('Please enter your full name.');if(!localMobile(state.mobile))return fail('Enter a valid UAE mobile number (9 digits after +971).');if(!validateEmail(state.email))return fail('Please enter a valid email address.');if(!state.consent)return fail('Please consent to contact and processing of the provided information.')}return true}

// Future integration example: await fetch('/api/health-enquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); handle server response/errors before showing real confirmation.

$('wizard').innerHTML=`<div class="success"><div class="success-icon">✓</div><p class="preview-badge">DEMO CONFIRMATION</p><h2>Thank you, ${esc(state.name.trim().split(/\s+/)[0])}!</h2><p>Your enquiry has been completed in this preview. On the live website, your details will be securely submitted and a PolicyHouse advisor will call you.</p><p class="note">No data was transmitted or saved to a CRM in this demo.</p><div class="contact-actions"><button type="button" class="contact-green" id="waAdvisor">WhatsApp Advisor ↗</button><button type="button" class="contact-green" id="callAdvisor">Call an Advisor ☎</button></div><p class="contact-help">Configure PolicyHouse’s official WhatsApp and advisor phone numbers in the HTML before publishing these contact buttons.</p><button class="primary" style="margin-top:20px;max-width:320px" id="restart">Start another enquiry</button></div>`;$('restart').onclick=()=>location.reload();$('waAdvisor').onclick=()=>{if(!/^\d{9,15}$/.test(POLICYHOUSE_WHATSAPP_NUMBER)){alert('WhatsApp contact is not yet configured in this preview.');return}const text='Hello PolicyHouse, I would like assistance with my health insurance enquiry.';window.open('https://wa.me/'+POLICYHOUSE_WHATSAPP_NUMBER+'?text='+encodeURIComponent(text),'_blank','noopener,noreferrer')};$('callAdvisor').onclick=()=>{if(!/^\+?\d{9,15}$/.test(POLICYHOUSE_ADVISOR_NUMBER)){alert('Advisor contact number is not yet configured in this preview.');return}window.location.href='tel:'+POLICYHOUSE_ADVISOR_NUMBER};scrollTop()}
document.documentElement.dataset.ageBuild=POLICYHOUSE_BUILD; $('next').onclick=next;$('back').onclick=back;for(const id of ['helpDesktop','helpMobile'])$(id).onclick=e=>{e.preventDefault();alert('Add PolicyHouse’s verified support contact before publishing.')};render();})();
